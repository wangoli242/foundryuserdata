<form autocomplete="off">
    <h3>Manage Saved Statuses</h3>
    <p class="notes">Add or remove statuses that can be quickly applied from the Token HUD.</p>

    <ul class="custom-status-list">
        {{#each savedStatuses}}
        <li class="flexrow"
            style="align-items: center; margin-bottom: 5px; background: rgba(0,0,0,0.1); padding: 5px; border-radius: 4px;">
            <img src="{{this.icon}}" width="32" height="32" style="flex: 0 0 32px; margin-right: 10px; border: none;">
            <strong style="flex: 1;">{{this.name}}</strong>
            <button class="config-delete" data-name="{{this.name}}" title="Delete"
                style="flex: 0 0 auto; width: auto; height: auto; padding: 0 5px; line-height: 24px;">
                <i class="fas fa-trash"></i>
            </button>
        </li>
        {{/each}}
        {{#unless savedStatuses.length}}
        <li class="notification info">No saved statuses yet.</li>
        {{/unless}}
    </ul>

    <hr>

    <h3>Add New Status</h3>
    <div class="form-group">
        <label>Name</label>
        <div class="form-fields">
            <input type="text" name="newName" placeholder="New Status Name">
        </div>
    </div>
    <div class="form-group">
        <label>Icon</label>
        <div class="form-fields">
            {{filePicker target="newIcon" type="image"}}
            <input class="image" type="text" name="newIcon" placeholder="path/to/icon.svg" value="{{defaultIcon}}">
        </div>
    </div>

    <button type="button" id="add-status-btn">
        <i class="fas fa-plus"></i> Add Status
    </button>
</form>
